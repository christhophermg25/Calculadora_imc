<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC - Unidad 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de Índice de Masa Corporal (IMC)</h1>
        <form id="imcForm">
            <div class="input-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" step="0.1" placeholder="Ej. 70" required>
            </div>
            <div class="input-group">
                <label for="estatura">Estatura (metros):</label>
                <input type="number" id="estatura" step="0.01" placeholder="Ej. 1.75" required>
            </div>
        </form>

        <div id="resultadoContainer" class="result-box">
            <h2>Resultado</h2>
            <p>Tu IMC es: <span id="imcValor">0.00</span></p>
            <p>Interpretación: <span id="imcInterpretacion">Ingresa tus datos</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
